services:
  mysql:
    image: mysql:8.0
    container_name: pedidos360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "pedidos360_secret_cookie"
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster

  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    restart: unless-stopped
    ports:
      - "5673:5672"      # AMQP port (mapeado a 5673 en host)
      - "15673:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "pedidos360_secret_cookie"
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq
      - ./docker/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster
    depends_on:
      - rabbitmq-1

volumes:
  mysql_data:
  rabbitmq_data_1:
  rabbitmq_data_2:

networks:
  rabbitmq_cluster:
    driver: bridge
