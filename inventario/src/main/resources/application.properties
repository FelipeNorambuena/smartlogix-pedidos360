spring.application.name=${SPRING_APPLICATION_NAME:inventario}
spring.profiles.default=dev
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

inventory.security.api-key=${INVENTARIO_API_KEY:}
inventory.security.header-name=${INVENTARIO_API_KEY_HEADER:X-API-Key}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}

# ============================================
# RabbitMQ - Conexion
# ============================================
# Lista de nodos del clúster: si rabbitmq-1 cae, el cliente conmuta a rabbitmq-2
# automáticamente en la siguiente conexión (failover real, no solo clúster decorativo).
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
# Si un mensaje no puede ni siquiera deserializarse, se rechaza sin reintentar
# (evita loops infinitos) y RabbitMQ lo reenruta a la DLQ via x-dead-letter-exchange.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ============================================
# RabbitMQ - Nombres centralizados (dominio inventario)
# ============================================
app.rabbitmq.exchange=inventario.topic.exchange
app.rabbitmq.dlx-exchange=inventario.dlx.exchange
app.rabbitmq.routing-key.stock-low=inventory.stock.low
app.rabbitmq.queue.alertas=inventario.alertas.q
app.rabbitmq.queue.alertas-dlq=inventario.alertas.dlq