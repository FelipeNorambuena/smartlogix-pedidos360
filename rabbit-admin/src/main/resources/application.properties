spring.application.name=${SPRING_APPLICATION_NAME:rabbit-admin}

server.port=${SERVER_PORT:8085}

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}

rabbitadmin.security.api-key=${RABBITADMIN_API_KEY:}
rabbitadmin.security.header-name=${RABBITADMIN_API_KEY_HEADER:X-API-Key}
